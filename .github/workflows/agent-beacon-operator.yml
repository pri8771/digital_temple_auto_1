name: Agent Beacon Operator

on:
  push:
    branches: [main]
    paths:
      - "operator/**"
      - "tests/**"
      - "config/**"
      - "schemas/**"
      - ".github/workflows/agent-beacon-operator.yml"
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: agent-beacon-operator
  cancel-in-progress: false

jobs:
  operate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out durable state
        uses: actions/checkout@v4

      - name: Verify zero-cost operator
        run: python3 -m unittest discover -s tests -v

      - name: Run one bounded operating cycle
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SHA: ${{ github.sha }}
        run: python3 operator/main.py

      - name: Persist state and machine-readable outputs
        run: |
          if [[ -n "$(git status --porcelain -- STATE.json METRICS.csv docs state/RUNS.jsonl)" ]]; then
            git config user.name "agent-beacon[bot]"
            git config user.email "13511421+pri8771@users.noreply.github.com"
            git add STATE.json METRICS.csv docs state/RUNS.jsonl
            git commit -m "chore(agent-beacon): persist operator cycle [skip ci]"
            git push
          else
            echo "No durable state changes to persist."
          fi
